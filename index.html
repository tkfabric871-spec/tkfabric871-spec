<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#5b35d5"><title>Smart Investment</title><link rel="stylesheet" href="styles.css"></head><body>
<div class="app-shell">
<section id="authView" class="auth-wrap"><div class="brand-panel"><div class="brand-mark">↗</div><div><strong>SMART</strong><span>INVESTMENT</span></div><p>Simple. Secure. Transparent.</p></div>
<div class="auth-card"><div class="auth-tabs"><button id="loginTab" class="active" onclick="switchAuth('login')">Login</button><button id="signupTab" onclick="switchAuth('signup')">Create account</button></div>
<div id="loginForm"><h1>Welcome back</h1><p class="muted">Sign in to manage your account.</p><label>Username</label><input id="loginUser" autocomplete="username" placeholder="Enter username"><label>Password</label><div class="password-row"><input id="loginPass" type="password" autocomplete="current-password" placeholder="Enter password"><button onclick="togglePassword('loginPass',this)">Show</button></div><button class="btn primary full" onclick="login()">Sign in <span>→</span></button></div>
<div id="signupForm" class="hidden"><h1>Create your account</h1><p class="muted">Start with a username and password.</p><label>Username</label><input id="signupUser" autocomplete="username" placeholder="Choose a username"><label>Password</label><input id="signupPass" type="password" autocomplete="new-password" placeholder="At least 6 characters"><label>Confirm password</label><input id="signupConfirm" type="password" autocomplete="new-password" placeholder="Repeat password"><label>Referral code <em>optional</em></label><input id="signupReferral" placeholder="Enter referral code if you have one"><button class="btn success full" onclick="signup()">Create account <span>→</span></button></div>
<div id="authMsg" class="toast hidden"></div></div></section>
<section id="appView" class="hidden"><header class="topbar"><div class="brand-inline"><div class="mini-logo">↗</div><div><b>Smart Investment</b><small>Member portal</small></div></div><div class="top-actions"><button class="icon-btn" onclick="openPage('notifications')">♢<i id="notifDot"></i></button><button class="icon-btn" onclick="toggleDrawer()">☰</button></div></header>
<div id="drawer" class="drawer hidden"><button onclick="openPage('dashboard');toggleDrawer()">⌂ Dashboard</button><button onclick="openPage('plans');toggleDrawer()">◈ Plans</button><button onclick="openPage('investments');toggleDrawer()">◉ My plans</button><button onclick="openPage('history');toggleDrawer()">◌ History</button><button onclick="openPage('withdrawal');toggleDrawer()">↗ Withdrawal</button><button onclick="openPage('profile');toggleDrawer()">◎ Profile</button><button onclick="logout()">↪ Logout</button></div>
<main id="content"></main>
<nav class="bottom-nav"><button data-page="dashboard" onclick="openPage('dashboard')">⌂<small>Home</small></button><button data-page="plans" onclick="openPage('plans')">◈<small>Plans</small></button><button data-page="investments" onclick="openPage('investments')">◉<small>My Plans</small></button><button data-page="withdrawal" onclick="openPage('withdrawal')">↗<small>Withdraw</small></button><button data-page="profile" onclick="openPage('profile')">◎<small>Profile</small></button></nav></section></div>
<script src="app.js"></script></body></html>
